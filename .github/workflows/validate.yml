name: Verify current code

on:
  push:
    branches: [main, codex/dev]
  pull_request:
  workflow_dispatch:
    inputs:
      direct_check:
        description: Optional brief Godot script demonstrating only the code just changed; no regression suite
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EVALUATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Select only the code changed in this update
        id: scope
        shell: python
        env:
          DIRECT_CHECK: ${{ inputs.direct_check }}
        run: |
          import json, os, pathlib, re, subprocess
          output = pathlib.Path(".artifacts/current-change")
          output.mkdir(parents=True, exist_ok=True)
          pathlib.Path(".artifacts/.gdignore").touch()
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          head = os.environ["EVALUATION_HEAD"]
          before = event.get("before", "")
          available = re.fullmatch(r"[0-9a-fA-F]{40}", before or "") and set(before) != {"0"} and subprocess.run(["git", "cat-file", "-e", before + "^{commit}"], stderr=subprocess.DEVNULL).returncode == 0
          if available:
              base = before
          elif event.get("pull_request"):
              # A first PR may contain many local checkpoint commits. Checking
              # only head^ would silently omit the earlier parts of its block.
              target = event["pull_request"]["base"]["sha"]
              base = subprocess.check_output(["git", "merge-base", target, head], text=True).strip()
          else:
              base = subprocess.check_output(["git", "rev-parse", head + "^"], text=True).strip()
          subprocess.run(["git", "diff", "--check", base, head], check=True)
          changed = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=ACMR", "-z", base, head]).decode().split("\0")
          scripts = [p for p in changed if p.startswith("game/") and p.endswith(".gd") and "/tests/" not in p]
          textures = ["game/test_art/tiny_battle/tile_0047.png", "game/test_art/tiny_battle/tile_0132.png", "game/test_art/tiny_battle/tile_0001.png", "game/test_art/tiny_battle/tile_0016.png", "game/test_art/roguelike_indoor/indoor_sheet.png", "game/test_art/tiny_battle/tile_0044.png", "game/test_art/tiny_battle/tile_0045.png", "game/test_art/tiny_battle/tile_0046.png", "game/test_art/tiny_battle/tile_0048.png", "game/test_art/tiny_battle/tile_0049.png", "game/test_art/tiny_battle/tile_0050.png", "game/test_art/tiny_battle/tile_0052.png", "game/test_art/roguelike_characters/character_sheet.png"]
          models = ["game/construction/assets/smoke.glb", "game/construction/assets/pylon.glb", "game/construction/assets/scissors.glb", "game/construction/assets/tape_half.glb", "game/characters/assets/construction_worker.glb", "game/characters/assets/soldier.glb", "game/characters/assets/rifle.glb", "game/preview_3d/assets/manager.fbx", "game/preview_3d/assets/manager_idle.fbx", "game/preview_3d/assets/manager_skin.png", "game/preview_3d/assets/supply_table.glb", "game/preview_3d/assets/material_box.glb", "game/preview_3d/assets/industrial/building_h.glb", "game/preview_3d/assets/industrial/building_k.glb", "game/preview_3d/assets/industrial/building_l.glb", "game/preview_3d/assets/industrial/textures/colormap.png", "game/preview_3d/assets/commercial/building_a.glb", "game/preview_3d/assets/commercial/textures/colormap.png", "game/preview_3d/assets/car_kit/truck_flat.glb", "game/preview_3d/assets/car_kit/delivery.glb", "game/preview_3d/assets/car_kit/textures/colormap.png"]
          models += ["game/warehousing/assets/" + name + ".glb" for name in ['warehouse_shell', 'warehouse_crate_rack', 'warehouse_long_stock_rack', 'medium_crate', 'small_crate', 'metal_stock', 'closed_keg', 'timber_bundle', 'textile_bale', 'fuel_can']]
          dependencies = textures + models
          asset_update = any(p in dependencies or p in [t + ".import" for t in dependencies] for p in changed)
          (output / "scripts.json").write_text(json.dumps(scripts), encoding="utf-8")
          direct = os.environ.get("DIRECT_CHECK", "").strip()
          if direct:
              (output / "direct_check.gd").write_text(direct + "\n", encoding="utf-8")
          (output / "scope.txt").write_text(f"revision={head}\nbase={base}\nchanged_scripts={scripts}\ndirect_check={bool(direct)}\nSyntax checks are not gameplay acceptance. No regression suites run.\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"engine={'true' if scripts or direct or asset_update else 'false'}\n")
              stream.write(f"direct={'true' if direct else 'false'}\n")
          print((output / "scope.txt").read_text())
      - name: Download and verify pinned Godot only when needed
        if: steps.scope.outputs.engine == 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < .godot-version)"
          archive="Godot_v${version}-stable_linux.x86_64.zip"
          release="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 "$release/$archive" --output "$archive"
          curl --fail --location --retry 3 "$release/SHA512-SUMS.txt" --output SHA512-SUMS.txt
          awk -v archive="$archive" '$2 == archive || $2 == "*" archive {print}' SHA512-SUMS.txt > selected-checksum.txt
          test "$(wc -l < selected-checksum.txt)" -eq 1
          sha512sum --check selected-checksum.txt
          unzip -q "$archive"
          chmod +x "Godot_v${version}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${version}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import only the declared texture and 3D dependencies
        if: steps.scope.outputs.engine == 'true'
        timeout-minutes: 1
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, shutil, subprocess, tempfile
          output = pathlib.Path(".artifacts/current-change")
          textures = ["game/test_art/tiny_battle/tile_0047.png", "game/test_art/tiny_battle/tile_0132.png", "game/test_art/tiny_battle/tile_0001.png", "game/test_art/tiny_battle/tile_0016.png", "game/test_art/roguelike_indoor/indoor_sheet.png", "game/test_art/tiny_battle/tile_0044.png", "game/test_art/tiny_battle/tile_0045.png", "game/test_art/tiny_battle/tile_0046.png", "game/test_art/tiny_battle/tile_0048.png", "game/test_art/tiny_battle/tile_0049.png", "game/test_art/tiny_battle/tile_0050.png", "game/test_art/tiny_battle/tile_0052.png", "game/test_art/roguelike_characters/character_sheet.png"]
          models = ["game/construction/assets/smoke.glb", "game/construction/assets/pylon.glb", "game/construction/assets/scissors.glb", "game/construction/assets/tape_half.glb", "game/characters/assets/construction_worker.glb", "game/characters/assets/soldier.glb", "game/characters/assets/rifle.glb", "game/preview_3d/assets/manager.fbx", "game/preview_3d/assets/manager_idle.fbx", "game/preview_3d/assets/manager_skin.png", "game/preview_3d/assets/supply_table.glb", "game/preview_3d/assets/material_box.glb", "game/preview_3d/assets/industrial/building_h.glb", "game/preview_3d/assets/industrial/building_k.glb", "game/preview_3d/assets/industrial/building_l.glb", "game/preview_3d/assets/industrial/textures/colormap.png", "game/preview_3d/assets/commercial/building_a.glb", "game/preview_3d/assets/commercial/textures/colormap.png", "game/preview_3d/assets/car_kit/truck_flat.glb", "game/preview_3d/assets/car_kit/delivery.glb", "game/preview_3d/assets/car_kit/textures/colormap.png"]
          models += ["game/warehousing/assets/" + name + ".glb" for name in ['warehouse_shell', 'warehouse_crate_rack', 'warehouse_long_stock_rack', 'medium_crate', 'small_crate', 'metal_stock', 'closed_keg', 'timber_bundle', 'textile_bale', 'fuel_can']]
          dependencies = textures + models
          # Only these data assets enter the isolated project; no game scripts or plugins.
          # FBX uses pinned Godot's built-in ufbx importer, not an external converter.
          project = pathlib.Path(tempfile.mkdtemp(prefix="trencho-asset-import-", dir=os.environ["RUNNER_TEMP"]))
          (project / "project.godot").write_text('config_version=5\n[application]\nconfig/name="Declared asset dependency import"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n', encoding="utf-8")
          for relative in dependencies:
              source = pathlib.Path(relative)
              if not source.is_file():
                  raise SystemExit("Missing declared asset dependency: " + relative)
              if source.read_bytes().startswith(b"version https://git-lfs.github.com/spec/v1"):
                  raise SystemExit("Declared asset is an unresolved LFS pointer: " + relative)
              target = project / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              sidecar = pathlib.Path(relative + ".import")
              if sidecar.is_file():
                  shutil.copy2(sidecar, project / (relative + ".import"))
          command = [os.environ["GODOT_BIN"], "--headless", "--path", str(project), "--import"]
          try:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=45)
          except subprocess.TimeoutExpired as error:
              log = error.stdout or b""
              (output / "texture-import.log").write_text(log.decode(errors="replace") if isinstance(log, bytes) else log, encoding="utf-8")
              raise SystemExit("Declared asset dependency import exceeded its 45-second deadline.")
          (output / "texture-import.log").write_text(result.stdout, encoding="utf-8")
          print(result.stdout, flush=True)
          if result.returncode or re.search(r"^\s*(SCRIPT ERROR:|ERROR:)", result.stdout, re.MULTILINE):
              raise SystemExit(result.returncode or 1)
          receipt = []
          for relative in dependencies:
              sidecar = project / (relative + ".import")
              if not sidecar.is_file():
                  raise SystemExit("Godot did not produce the declared asset sidecar: " + relative)
              destination = pathlib.Path(relative + ".import")
              shutil.copy2(sidecar, destination)
              retained = output / ("model-sidecars" if pathlib.Path(relative).suffix in [".fbx", ".glb"] else "texture-sidecars") / (relative + ".import")
              retained.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(sidecar, retained)
              receipt.append({"source": relative, "source_sha256": hashlib.sha256(pathlib.Path(relative).read_bytes()).hexdigest(), "sidecar_sha256": hashlib.sha256(sidecar.read_bytes()).hexdigest()})
          cache = project / ".godot/imported"
          if not cache.is_dir():
              raise SystemExit("Godot did not produce the isolated asset import cache.")
          # Copy only actual engine-generated imports from the isolated data-only project.
          destination = pathlib.Path(".godot/imported")
          destination.mkdir(parents=True, exist_ok=True)
          for imported in cache.iterdir():
              if imported.is_file():
                  shutil.copy2(imported, destination / imported.name)
          # Keep the actual isolated import's UID map with its generated resources.
          # Its res:// paths refer only to the exact declared data assets above.
          resource_uids = project / ".godot/uid_cache.bin"
          if not resource_uids.is_file():
              raise SystemExit("Godot did not produce the isolated asset UID cache.")
          shutil.copy2(resource_uids, destination.parent / "uid_cache.bin")
          (output / "texture-import.json").write_text(json.dumps({"assets": receipt, "scope": "Declared PNG/FBX/GLB dependencies only; no game project/editor/plugin scan, external converter or gameplay."}, indent=2) + "\n", encoding="utf-8")
      - name: Parse changed production scripts only
        if: steps.scope.outputs.engine == 'true'
        timeout-minutes: 3
        shell: python
        run: |
          import json, os, pathlib, re, subprocess
          output = pathlib.Path(".artifacts/current-change")
          for index, script in enumerate(json.loads((output / "scripts.json").read_text())):
              command = ["timeout", "--signal=TERM", "--kill-after=5s", "30s", os.environ["GODOT_BIN"], "--headless", "--path", ".", "--check-only", "--script", "res://" + script]
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (output / f"parse-{index:03d}.log").write_text(result.stdout, encoding="utf-8")
              print(script, result.stdout, flush=True)
              if result.returncode or re.search(r"^\s*(SCRIPT ERROR:|ERROR:)", result.stdout, re.MULTILINE):
                  raise SystemExit(result.returncode or 1)
      - name: Run the optional brief demonstration of the current change
        if: steps.scope.outputs.direct == 'true'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 45s "$GODOT_BIN" --headless --path . --audio-driver Dummy --script res://.artifacts/current-change/direct_check.gd > .artifacts/current-change/direct.log 2>&1
          cat .artifacts/current-change/direct.log
          if grep -E '^\s*(SCRIPT ERROR:|ERROR:)' .artifacts/current-change/direct.log; then exit 1; fi
      - name: Retain only current-change evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: current-change-evidence
          path: .artifacts/current-change/
          include-hidden-files: true
          retention-days: 7

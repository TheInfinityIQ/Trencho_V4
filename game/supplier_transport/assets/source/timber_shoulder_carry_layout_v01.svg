a" stroke="none" stroke-width="1"/><polyline points="589.50,426.44 589.50,379.16" fill="none" stroke="#248c8a" stroke-width="3"/><polygon points="589.50,379.16 593.50,389.16 585.50,389.16" fill="#248c8a" stroke="none" stroke-width="1"/><polyline points="498.00,842.00 498.00,870.00" fill="none" stroke="#53676c" stroke-width="1"/><polyline points="742.00,842.00 742.00,870.00" fill="none" stroke="#53676c" stroke-width="1"/><polyline points="498.00,870.00 742.00,870.00" fill="none" stroke="#53676c" stroke-width="1.2"/><polygon points="498.00,870.00 506.00,873.00 506.00,867.00" fill="#53676c" stroke="none" stroke-width="1"/><polygon points="742.00,870.00 734.00,873.00 734.00,867.00" fill="#53676c" stroke="none" stroke-width="1"/><polygon points="558.25,853.00 681.75,853.00 681.75,886.00 558.25,886.00" fill="#faf9f4" stroke="none" stroke-width="1"/><text x="565.25" y="871.58" font-family="Segoe UI,sans-serif" font-size="19" font-weight="400" fill="#53676c">800 mm aisle</text><polyline points="430.00,420.00 589.50,395.94" fill="none" stroke="#248c8a" stroke-width="2"/><polygon points="589.50,395.94 580.20,401.39 579.01,393.47" fill="#248c8a" stroke="none" stroke-width="1"/><text x="90.00" y="338.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">Measured shoulder surface:</text><text x="90.00" y="365.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">local X −220 / Y 1462.5 mm.</text><text x="90.00" y="392.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">Timber rests on the shoulder;</text><text x="90.00" y="419.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">hands stabilize its sides.</text><polyline points="900.00,420.00 604.43,368.49" fill="none" stroke="#248c8a" stroke-width="2"/><polygon points="604.43,368.49 614.97,366.26 613.60,374.15" fill="#248c8a" stroke="none" stroke-width="1"/><text x="865.00" y="311.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">20 mm head-side gap.</text><text x="865.00" y="338.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">Bundle stays flat:</text><text x="865.00" y="365.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">320 wide × 162 high.</text><text x="865.00" y="392.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">Top reference: 1624.5.</text><text x="90.00" y="679.76" font-family="Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#53676c">Root X +120 mm.</text><text x="90.00" y="704.76" font-family="Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#53676c">Load centre X −211 mm.</text><text x="90.00" y="729.76" font-family="Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#53676c">Rack/load gap: ≈29 mm.</text><text x="90.00" y="754.76" font-family="Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#53676c">Stabilizing arm limit:</text><text x="90.00" y="779.76" font-family="Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#53676c">local X ≤+260 →20 mm gap.</text><text x="90.00" y="804.76" font-family="Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#53676c">Actual arm fit still required.</text><text x="90.00" y="829.76" font-family="Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#53676c">Old idle arm exceeds rack</text><text x="90.00" y="854.76" font-family="Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#53676c">by56.7 mm.</text><polygon points="1370.00,605.80 2000.00,820.00 2000.00,825.25 1370.00,611.05" fill="#69828a" stroke="#344f5b" stroke-width="1"/><polygon points="1540.77,668.96 1573.77,668.96 1574.77,642.96 1545.77,637.96" fill="#344f5b" stroke="none" stroke-width="1"/><polygon points="1585.77,662.96 1608.77,657.96 1602.77,631.96 1582.77,636.96" fill="#344f5b" stroke="none" stroke-width="1"/><polygon points="1548.77,641.96 1564.77,641.96 1571.77,479.96 1550.77,479.96" fill="#69828a" stroke="none" stroke-width="1"/><polygon points="1585.77,637.96 1600.77,636.96 1573.77,479.96 1556.77,479.96" fill="#69828a" stroke="none" stroke-width="1"/><polygon points="1537.77,488.36 1580.77,488.36 1583.77,377.06 1540.77,362.36" fill="#ba7c2f" stroke="#344f5b" stroke-width="1"/><polygon points="1539.77,358.16 1578.77,358.16 1580.77,314.06 1540.77,309.86" fill="#bb9471" stroke="#344f5b" stroke-width="1"/><polygon points="1533.77,316.16 1540.77,290.96 1563.77,286.03 1581.77,297.26 1585.77,316.16" fill="#d6aa43" stroke="#344f5b" stroke-width="1"/><text x="1620.77" y="559.36" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1d3038">AFT</text><polygon points="1799.23,756.84 1832.23,756.84 1833.23,730.84 1804.23,725.84" fill="#344f5b" stroke="none" stroke-width="1"/><polygon points="1844.23,750.84 1867.23,745.84 1861.23,719.84 1841.23,724.84" fill="#344f5b" stroke="none" stroke-width="1"/><polygon points="1807.23,729.84 1823.23,729.84 1830.23,567.84 1809.23,567.84" fill="#69828a" stroke="none" stroke-width="1"/><polygon points="1844.23,725.84 1859.23,724.84 1832.23,567.84 1815.23,567.84" fill="#69828a" stroke="none" stroke-width="1"/><polygon points="1796.23,576.24 1839.23,576.24 1842.23,464.94 1799.23,450.24" fill="#ba7c2f" stroke="#344f5b" stroke-width="1"/><polygon points="1798.23,446.04 1837.23,446.04 1839.23,401.94 1799.23,397.74" fill="#bb9471" stroke="#344f5b" stroke-width="1"/><polygon points="1792.23,404.04 1799.23,378.84 1822.23,373.90 1840.23,385.14 1844.23,404.04" fill="#d6aa43" stroke="#344f5b" stroke-width="1"/><text x="1879.23" y="647.24" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1d3038">FORE</text><polygon points="1486.18,338.18 1883.82,473.38 1894.77,441.17 1497.13,305.97" fill="#b9aa88" stroke="#ba7c2f" stroke-width="1.5"/><polygon points="1549.77,361.84 1555.77,355.84 1561.77,361.84 1555.77,367.84" fill="#248c8a" stroke="none" stroke-width="1"/><polygon points="1808.23,449.72 1814.23,443.72 1820.23,449.72 1814.23,455.72" fill="#248c8a" stroke="none" stroke-width="1"/><polyline points="2060.00,285.00 2240.00,285.00" fill="none" stroke="#248c8a" stroke-width="3"/><polygon points="2240.00,285.00 2230.00,289.00 2230.00,281.00" fill="#248c8a" stroke="none" stroke-width="1"/><text x="2074.51" y="258.86" font-family="Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#1d3038">TRAVEL +Z</text><text x="1260.00" y="217.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Two real workers: 1.3 m apart along the bundle.</text><text x="1260.00" y="245.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Fore worker leads; aft worker follows. Same shoulder.</text><text x="1260.00" y="273.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">No sideways ramp shuffle or automatic role swapping.</text><text x="1260.00" y="861.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">18.78° ramp: projected spacing1.231 m, height difference419 mm.</text><text x="1260.00" y="888.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">Pitch follows the two actual shoulder supports. No added load bob.</text><text x="1260.00" y="915.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">Short planted steps;2–3 cm swing target; knees absorb the step.</text><polygon points="90.00,1040.00 135.00,1040.00 135.00,1080.00 90.00,1080.00" fill="#248c8a" stroke="none" stroke-width="1"/><text x="105.50" y="1061.86" font-family="Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#ffffff">1</text><text x="155.00" y="1056.86" font-family="Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#1d3038">PALMS UNDER</text><text x="155.00" y="1088.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">Reuse the synchronized existing bend.</text><text x="155.00" y="1115.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#53676c">Volar palm + fingers support real underside.</text><polygon points="90.00,1148.00 135.00,1148.00 135.00,1188.00 90.00,1188.00" fill="#248c8a" stroke="none" stroke-width="1"/><text x="105.50" y="1169.86" font-family="Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#ffffff">2</text><text x="155.00" y="1164.86" font-family="Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#1d3038">CLEAR → TURN → SETTLE</text><text x="155.00" y="1196.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">Withdraw clear of rack; reorient both feet.</text><text x="155.00" y="1223.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#53676c">Lift outside the helmet, then settle together.</text><polygon points="90.00,1256.00 135.00,1256.00 135.00,1296.00 90.00,1296.00" fill="#248c8a" stroke="none" stroke-width="1"/><text x="105.50" y="1277.86" font-family="Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#ffffff">3</text><text x="155.00" y="1272.86" font-family="Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#1d3038">SHOULDER TRAVEL</text><text x="155.00" y="1304.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">Shoulders bear the load; hands steady it.</text><text x="155.00" y="1331.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#53676c">Forward tandem gait, measured ramp support.</text><polygon points="90.00,1364.00 135.00,1364.00 135.00,1404.00 90.00,1404.00" fill="#248c8a" stroke="none" stroke-width="1"/><text x="105.50" y="1385.86" font-family="Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#ffffff">4</text><text x="155.00" y="1380.86" font-family="Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#1d3038">HANDS UNDER → LOWER</text><text x="155.00" y="1412.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#1d3038">Take weight in both palms before unseating.</text><text x="155.00" y="1439.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#53676c">Reuse the original bend body to put it down.</text><text x="1240.00" y="1057.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Truck rear header:1.960 m above deck; upright hat1.8235.</text><text x="1240.00" y="1085.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Reference hat gap136.5 mm; flat bundle gap335.5 mm.</text><text x="1240.00" y="1113.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">These are source samples, not a completed moving-clearance pass.</text><text x="1240.00" y="1177.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Warehouse: use the existing clear staging area before the bay.</text><text x="1240.00" y="1205.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Come off the shoulder and turn side-on BEFORE close approach.</text><text x="1240.00" y="1233.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Keep .60 /1.75 m support planes; upper placement is a two-hand lift.</text><text x="1240.00" y="1261.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Keep3 m open turn space. Never route a shoulder load into stock.</text><text x="1240.00" y="1337.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Provisional travel target:0.20–0.24 m steps at0.25–0.30 m/s.</text><text x="1240.00" y="1365.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Aim ≤10 mm residual load bob, after removing terrain/pitch.</text><text x="1240.00" y="1393.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Next review: full pickup→shoulder→ramp→put-down, normal speed,</text><text x="1240.00" y="1421.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">both hands/feet visible. No revised clips until layout acceptance.</text><text x="60.00" y="1593.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#53676c">CONCEPT ONLY  •  anatomical palm identification, actual stabilizing arms, transitions, ramp breakover and warehouse fitting remain to be checked.</text></svg>
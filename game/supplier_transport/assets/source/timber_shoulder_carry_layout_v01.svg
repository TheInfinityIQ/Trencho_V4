<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1660" viewBox="0 0 2400 1660"><rect width="100%" height="100%" fill="#f0eee7"/><text x="60.00" y="59.16" font-family="Segoe UI,sans-serif" font-size="38" font-weight="700" fill="#1d3038">TIMBER  /  TWO-PERSON SHOULDER CARRY</text><text x="62.00" y="102.86" font-family="Segoe UI,sans-serif" font-size="23" font-weight="400" fill="#53676c">One proposed layout • existing 2 m bundle / 50 kg maximum • original pickup body retained</text><polygon points="1850.00,32.00 2340.00,32.00 2340.00,87.00 1850.00,87.00" fill="#344f5b" stroke="none" stroke-width="1"/><text x="1914.03" y="63.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#ffffff">LAYOUT ONLY  /  BEFORE MOTION</text><polygon points="60.00,145.00 1180.00,145.00 1180.00,935.00 60.00,935.00" fill="#faf9f4" stroke="#d7ddd9" stroke-width="1.4"/><polygon points="80.00,165.00 115.00,165.00 115.00,200.00 80.00,200.00" fill="#344f5b" stroke="none" stroke-width="1"/><text x="89.75" y="185.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#ffffff">A</text><text x="130.00" y="185.50" font-family="Segoe UI,sans-serif" font-size="25" font-weight="700" fill="#1d3038">Front section  /  right shoulder bears the load</text><polygon points="1210.00,145.00 2340.00,145.00 2340.00,935.00 1210.00,935.00" fill="#faf9f4" stroke="#d7ddd9" stroke-width="1.4"/><polygon points="1230.00,165.00 1265.00,165.00 1265.00,200.00 1230.00,200.00" fill="#344f5b" stroke="none" stroke-width="1"/><text x="1240.50" y="185.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#ffffff">B</text><text x="1280.00" y="185.50" font-family="Segoe UI,sans-serif" font-size="25" font-weight="700" fill="#1d3038">Ramp  /  both workers face the direction of travel</text><polygon points="60.00,965.00 1180.00,965.00 1180.00,1530.00 60.00,1530.00" fill="#faf9f4" stroke="#d7ddd9" stroke-width="1.4"/><polygon points="80.00,985.00 115.00,985.00 115.00,1020.00 80.00,1020.00" fill="#344f5b" stroke="none" stroke-width="1"/><text x="90.75" y="1005.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#ffffff">C</text><text x="130.00" y="1005.50" font-family="Segoe UI,sans-serif" font-size="25" font-weight="700" fill="#1d3038">Pickup → shoulder → travel → put-down</text><polygon points="1210.00,965.00 2340.00,965.00 2340.00,1530.00 1210.00,1530.00" fill="#faf9f4" stroke="#d7ddd9" stroke-width="1.4"/><polygon points="1230.00,985.00 1265.00,985.00 1265.00,1020.00 1230.00,1020.00" fill="#344f5b" stroke="none" stroke-width="1"/><text x="1239.50" y="1005.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#ffffff">D</text><text x="1280.00" y="1005.50" font-family="Segoe UI,sans-serif" font-size="25" font-weight="700" fill="#1d3038">Clearance and movement contract</text><polygon points="421.75,842.00 498.00,842.00 498.00,244.20 421.75,244.20" fill="#d9ded9" stroke="#344f5b" stroke-width="1"/><polyline points="498.00,842.00 498.00,244.20" fill="none" stroke="#ba7c2f" stroke-width="2" stroke-dasharray="7 5"/><polygon points="742.00,842.00 818.25,842.00 818.25,244.20 742.00,244.20" fill="#d9ded9" stroke="#344f5b" stroke-width="1"/><polyline points="742.00,842.00 742.00,244.20" fill="none" stroke="#ba7c2f" stroke-width="2" stroke-dasharray="7 5"/><polyline points="421.75,842.00 818.25,842.00" fill="none" stroke="#344f5b" stroke-width="2"/><polygon points="603.23,842.00 645.92,842.00 644.40,805.40 610.85,799.30" fill="#344f5b" stroke="#344f5b" stroke-width="1"/><polygon points="612.38,802.35 639.83,802.35 647.45,570.55 616.95,570.55" fill="#69828a" stroke="#344f5b" stroke-width="1"/><polygon points="667.27,842.00 709.98,842.00 708.45,805.40 674.90,799.30" fill="#344f5b" stroke="#344f5b" stroke-width="1"/><polygon points="676.42,802.35 703.88,802.35 696.25,570.55 665.75,570.55" fill="#69828a" stroke="#344f5b" stroke-width="1"/><polygon points="601.70,576.65 711.50,576.65 7
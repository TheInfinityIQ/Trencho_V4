1"/><polygon points="1788.75,775.00 1809.75,775.00 1837.75,512.50 1813.25,512.50" fill="#69828a" stroke="#344f5b" stroke-width="1"/><polygon points="1809.75,775.00 1830.75,775.00 1837.75,512.50 1813.25,512.50" fill="#69828a" stroke="#344f5b" stroke-width="1"/><polygon points="1811.50,519.50 1844.75,519.50 1935.75,390.00 1906.00,384.75" fill="#ba7c2f" stroke="#344f5b" stroke-width="1"/><polygon points="1914.75,390.00 1934.00,390.00 1967.25,362.00 1949.75,362.00" fill="#bb9471" stroke="#344f5b" stroke-width="1"/><polygon points="1941.00,365.50 1983.00,365.50 1983.00,309.50 1941.00,309.50" fill="#bb9471" stroke="#344f5b" stroke-width="1"/><polygon points="1930.50,316.50 1937.50,285.00 1958.50,274.50 1986.50,292.00 1990.00,316.50" fill="#d6aa43" stroke="#344f5b" stroke-width="1"/><polyline points="1923.50,390.00 1978.45,466.65 2046.00,411.00" fill="none" stroke="#ba7c2f" stroke-width="17"/><polyline points="2046.00,411.00 2058.25,411.00" fill="none" stroke="#344f5b" stroke-width="13"/><polygon points="2053.25,411.00 2058.25,406.00 2063.25,411.00 2058.25,416.00" fill="#248c8a" stroke="none" stroke-width="1"/><polyline points="1808.00,852.00 1808.00,810.00" fill="none" stroke="#248c8a" stroke-width="2"/><polygon points="1808.00,810.00 1812.00,820.00 1804.00,820.00" fill="#248c8a" stroke="none" stroke-width="1"/><text x="1726.26" y="872.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1d3038">ROOT X -520 mm</text><text x="90.00" y="247.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Same assigned unloading worker.</text><text x="90.00" y="275.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Face+X, yaw+PI/2.</text><text x="90.00" y="303.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Approach rootX−750 →−625.</text><text x="90.00" y="331.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Closed controls are on the</text><text x="90.00" y="359.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">near fixed front post.</text><polyline points="420.00,470.00 757.75,575.50" fill="none" stroke="#248c8a" stroke-width="2"/><polygon points="757.75,575.50 747.01,576.34 749.40,568.70" fill="#248c8a" stroke="none" stroke-width="1"/><text x="90.00" y="542.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Actual underside grip:</text><text x="90.00" y="570.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">X−235 / Y670 / Z±150 mm.</text><text x="90.00" y="598.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Palms underneath; fingers</text><text x="90.00" y="626.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">wrap the real metal edge.</text><text x="90.00" y="654.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Two grips share this projection.</text><text x="1240.00" y="247.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">One hand continues to hold;</text><text x="1240.00" y="275.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">the other secures parked pins</text><text x="1240.00" y="303.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">through the accessible control.</text><text x="1240.00" y="331.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">No self-moving shelf or</text><text x="1240.00" y="359.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">contact with hidden pins.</text><polyline points="1580.00,455.00 2058.25,411.00" fill="none" stroke="#248c8a" stroke-width="2"/><polygon points="2058.25,411.00 2048.66,415.90 2047.93,407.93" fill="#248c8a" stroke="none" stroke-width="1"/><text x="1240.00" y="542.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Same material edge at park:</text><text x="1240.00" y="570.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">X195 / Y1140 / Z±150 mm.</text><text x="1240.00" y="598.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Short step + controlled</text><text x="1240.00" y="626.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">hip/knee motion follows it.</text><text x="1240.00" y="654.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Hands clear before bale pickup.</text><text x="90.00" y="916.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#53676c">Illustrative body/feet, not a fitted pose. Controls A/B are proposed new geometry.</text><text x="1240.00" y="916.40" font-family="Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#53676c">Actual arm chain520 mm; root-to-parked-edge span715 mm needs body motion.</text><text x="90.00" y="1058.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#1d3038">OPEN  /  8.0 s reference</text><text x="90.00" y="1087.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#1d3038">1.00 approach →1.00 manual unlock →0.75 both grips</text><text x="90.00" y="1116.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#1d3038">→3.00 controlled lift →1.00 parked latch →1.25 hands clear.</text><text x="90.00" y="1145.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#1d3038"></text><text x="90.00" y="1174.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#1d3038">CLOSE  /  8.0 s reference</text><text x="90.00" y="1203.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#1d3038">1.00 approach →0.75 support grip →1.00 parked unlock</text><text x="90.00" y="1232.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#1d3038">→3.00 lower onto seats →1.00 closed lock →1.25 hands clear.</text><text x="1240.00" y="1057.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">A: fixed-post closed-lock paddle (−264,780,−337.5) mm.</text><text x="1240.00" y="1085.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">B: parked-lock paddle (−264,1100,−337.5) mm.</text><text x="1240.00" y="1113.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">40×18 mm faces,8 mm recess,3 mm stroke; within footprint.</text><text x="1240.00" y="1141.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Fixed-frame linkage operates both end pins; no cargo-space cable.</text><text x="1240.00" y="1169.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038"></text><text x="1240.00" y="1197.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Keep full padding/support, ordinary planes, M05-only insert.</text><text x="1240.00" y="1225.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Check real gloves, torso/helmet, boots, bale, truck and neighbours.</text><text x="1240.00" y="1253.22" font-family="Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Receiving owns worker/time/stock/pause. No animation custody.</text><text x="60.00" y="1593.04" font-family="Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#53676c">LAYOUT ONLY  •  front-post controls/linkage and actual operator reach need Lead acceptance before revised worker/mechanism clips and full review video.</text></svg>